FileSet {
  Name = "CiberNovaLinux"
  Description = "Configuracion y datos de los servidores Linux de CiberNova (27/11/2026)"
  Include {
    Options {
      Signature = XXH128
      Compression = LZ4
    }
    File = /etc
    File = /root
    File = /home
    File = /usr/local/sbin
    File = /var/www
    File = /srv/sftp
    File = /var/opt/mssql/backup
  }
  Exclude {
    File = /var/opt/mssql/data
    File = /var/opt/mssql/log
  }
}
