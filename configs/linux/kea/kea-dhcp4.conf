// Version: 1.1
// /etc/kea/kea-dhcp4.conf de LNX01 y LNX02 (identico salvo "this-server-name"). 27/11/2026 - Max y Oriol.
// DHCP solo en la red aislada vmbr1 (ens19, 10.10.10.0/24). Kea HA hot-standby: LNX01 primario, LNX02 en espera.
// Los dos Kea se hablan por HTTP con el escuchador propio del servidor (multi-threading), sin kea-ctrl-agent.
// v1.1: "output_options" con guion bajo (Kea 2.4.1 no acepta "output-options", que es de versiones posteriores).
{
"Dhcp4": {
    // Solo la tarjeta de la red aislada: nunca ens18 (red del aula).
    "interfaces-config": { "interfaces": [ "ens19" ] },
    "control-socket": { "socket-type": "unix", "socket-name": "/run/kea/kea4-ctrl-socket" },
    "lease-database": { "type": "memfile", "persist": true, "name": "/var/lib/kea/kea-leases4.csv", "lfc-interval": 3600 },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "multi-threading": { "enable-multi-threading": true, "thread-pool-size": 4, "packet-queue-size": 64 },
    "hooks-libraries": [
        { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so", "parameters": { } },
        { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
          "parameters": { "high-availability": [ {
              "this-server-name": "lnx01",
              "mode": "hot-standby",
              "heartbeat-delay": 10000,
              "max-response-delay": 30000,
              "max-ack-delay": 5000,
              // 0: el nodo en espera no espera a ver clientes sin respuesta (la prueba se hace con un solo cliente).
              "max-unacked-clients": 0,
              "multi-threading": { "enable-multi-threading": true, "http-dedicated-listener": true, "http-listener-threads": 0, "http-client-threads": 0 },
              "peers": [
                  { "name": "lnx01", "url": "http://10.10.10.28:8000/", "role": "primary", "auto-failover": true },
                  { "name": "lnx02", "url": "http://10.10.10.29:8000/", "role": "standby", "auto-failover": true }
              ]
          } ] } }
    ],
    "subnet4": [ {
        "id": 1,
        "subnet": "10.10.10.0/24",
        "pools": [ { "pool": "10.10.10.100 - 10.10.10.200" } ],
        // Red cerrada: sin puerta de enlace ni DNS (no hay salida). Solo el nombre de dominio.
        "option-data": [ { "name": "domain-name", "data": "cibernova.local" } ]
    } ],
    "loggers": [ { "name": "kea-dhcp4", "output_options": [ { "output": "stdout" } ], "severity": "INFO" } ]
}
}
